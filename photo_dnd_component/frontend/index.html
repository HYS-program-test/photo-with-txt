<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; font-family:"Microsoft JhengHei", -apple-system, sans-serif; }
  #dnd-status { font-size:11px; color:#c0392b; padding:3px 6px; background:#fff8f0;
      border-bottom:1px dashed #eab676; min-height:14px; white-space:pre-wrap; }
  #scroll-wrap { max-height: 480px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .pool-wrap { position: sticky; top: 0; z-index: 5; background:#ffffff;
      display:flex; flex-wrap:wrap; gap:8px; padding:8px 4px 14px 4px;
      border-bottom:3px solid #2b7cff; min-height:60px; }
  .pool-wrap:empty::after { content:"（全部照片已指派完畢）"; color:#9aa4b2; font-size:13px; }
  .photo-chip { width:60px; height:60px; border-radius:6px; overflow:hidden;
      border:1px solid #ccc; cursor:grab; flex:none; touch-action:none; }
  .photo-chip img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .row-block { display:flex; align-items:flex-start; gap:10px; border-bottom:1px solid #eee; padding:10px 4px; }
  .row-num { flex:0 0 30px; font-size:20px; font-weight:700; color:#111827; padding-top:26px; }
  .row-drop { flex:1; min-height:76px; background:#f3f5f8; border-radius:8px;
      padding:6px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:6px;
      touch-action:none; overflow-y:auto; box-sizing:border-box; }
  .row-drop:empty::after { content:"尚未指派照片"; color:#9aa4b2; font-size:11px; }
  .sortable-ghost { opacity:0.3; }
</style>
</head>
<body>
  <div id="dnd-status">狀態：等待 Streamlit 初次渲染…</div>
  <div id="scroll-wrap">
    <div class="pool-wrap dnd-list" data-row="__pool__" id="pool-wrap"></div>
    <div id="rows-wrap"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
  (function () {
    function postToStreamlit(type, extra) {
      var payload = Object.assign({ isStreamlitMessage: true, type: type }, extra || {});
      window.parent.postMessage(payload, "*");
    }
    function setComponentValue(value) {
      postToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
    }
    function setFrameHeight() {
      var wrap = document.getElementById("scroll-wrap");
      var status = document.getElementById("dnd-status");
      var h = (wrap ? wrap.getBoundingClientRect().height : 0) + (status ? status.getBoundingClientRect().height : 0) + 6;
      postToStreamlit("streamlit:setFrameHeight", { height: Math.ceil(h) });
    }
    function componentReady() {
      postToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    }
    function log(msg) {
      var el = document.getElementById("dnd-status");
      if (el) el.textContent = "狀態：" + msg;
    }

    var lastRenderedStr = null;

    function chipHtml(photoKey, b64) {
      return '<div class="photo-chip" data-photo="' + photoKey + '">' +
             '<img src="data:image/jpeg;base64,' + b64 + '"></div>';
    }

    function render(args) {
      var photos = args.photos || {};
      var assignments = args.assignments || {};
      var rowKeys = args.rowKeys || [];

      var incomingSig = JSON.stringify({ a: assignments, r: rowKeys, p: Object.keys(photos) });
      if (lastRenderedStr !== null && incomingSig === lastRenderedStr) {
        setFrameHeight();
        return;
      }
      lastRenderedStr = incomingSig;

      var assignedKeys = {};
      Object.keys(assignments).forEach(function (rk) {
        (assignments[rk] || []).forEach(function (pk) { assignedKeys[pk] = true; });
      });

      var poolHtml = "";
      Object.keys(photos).forEach(function (pk) {
        if (!assignedKeys[pk]) poolHtml += chipHtml(pk, photos[pk]);
      });
      document.getElementById("pool-wrap").innerHTML = poolHtml;

      var rowsHtml = "";
      rowKeys.forEach(function (rk) {
        var keys = assignments[rk] || [];
        var itemsHtml = "";
        keys.forEach(function (pk) {
          if (photos[pk]) itemsHtml += chipHtml(pk, photos[pk]);
        });
        rowsHtml += '' +
          '<div class="row-block">' +
            '<div class="row-num">' + rk + '</div>' +
            '<div class="dnd-list row-drop" data-row="' + rk + '">' + itemsHtml + '</div>' +
          '</div>';
      });
      document.getElementById("rows-wrap").innerHTML = rowsHtml;

      initSortable();
      setFrameHeight();
    }

    function gatherAssignments() {
      var assignments = {};
      document.querySelectorAll(".row-drop").forEach(function (el) {
        var row = el.getAttribute("data-row");
        assignments[row] = Array.from(el.querySelectorAll(".photo-chip")).map(function (c) {
          return c.getAttribute("data-photo");
        });
      });
      return assignments;
    }

    function syncState(reason) {
      var assignments = gatherAssignments();
      var photoKeys = window.__lastPhotoKeys || [];
      var rowKeys = window.__lastRowKeys || [];
      lastRenderedStr = JSON.stringify({ a: assignments, r: rowKeys, p: photoKeys });
      setComponentValue({ assignments: assignments });
      log("已同步（" + reason + "）");
    }

    function initSortable() {
      if (typeof Sortable === "undefined") {
        log("錯誤：Sortable.js 沒有成功載入（可能是網路擋住了 CDN）");
        return;
      }
      var lists = document.querySelectorAll(".dnd-list");
      lists.forEach(function (el) {
        new Sortable(el, {
          group: "photos",
          animation: 150,
          ghostClass: "sortable-ghost",
          onEnd: function () {
            syncState("拖放結束");
            setFrameHeight();
          }
        });
      });
      log("已初始化，共 " + lists.length + " 個拖曳清單，可以開始拖曳照片");
    }

    window.addEventListener("message", function (event) {
      if (!event.data || event.data.type !== "streamlit:render") return;
      var args = event.data.args || {};
      window.__lastPhotoKeys = Object.keys(args.photos || {});
      window.__lastRowKeys = args.rowKeys || [];
      render(args);
    });

    componentReady();
    setFrameHeight();
  })();
  </script>
</body>
</html>
